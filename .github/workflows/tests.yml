name: Run tests
on: [push]

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Run tests
        run: ./gradlew clean test

      - name: Publish actions report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Gradle Tests
          path: '**/build/test-results/test/TEST*.xml'
          reporter: java-junit
          fail-on-error: true

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build allure report - strata-tests
        uses: simple-elf/allure-report-action@v1.10
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: strata-tests/build/allure-results
          subfolder: strata-tests

      - name: Build allure report - ta4j-tests
        uses: simple-elf/allure-report-action@v1.10
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: ta4j-tests/build/allure-results
          subfolder: ta4j-tests

      - name: Build reports index page
        if: always()
        run: |
          cat > allure-history/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Java Finance Toolkit Tests - Allure Reports</title>
            <style>
              body { font-family: sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
              h1 { font-size: 1.4rem; }
              ul { line-height: 2; padding-left: 1.2rem; }
              a { text-decoration: none; color: #1a73e8; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>Java Finance Toolkit Tests &mdash; Allure Reports</h1>
            <ul>
              <li><a href="strata-tests/">strata-tests</a> &mdash; <a href="https://github.com/OpenGamma/Strata">OpenGamma Strata</a></li>
              <li><a href="ta4j-tests/">ta4j-tests</a> &mdash; <a href="https://github.com/ta4j/ta4j">ta4j</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Publish allure test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
